<style>

/* ================= フォント ================= */

@font-face{
    font-family:'Bespoke';
    src:url('../fonts/Bespoke-MjPdRlygxs.ttf');
}

/* ================= 全体 ================= */

body{
    margin:0;
    background:#290db7;
    font-family:'Bespoke';
    color:white;
    cursor: none; /* 元カーソル非表示 */
}
html, body, * {
    cursor: none !important;
}


/* ================= ロゴ ================= */

.logo{
    position:fixed;
    top:30px;
    left:60px;
    padding:10px 25px;
    border:1px solid white;
    border-radius:40px;
    text-decoration:none;
    color:white;
    z-index:100;
    transition:0.3s ease; 
    z-index: 10000;
}
.logo:hover{
    color:#5400fd;           
    border-color:#5400fd;    
}
.logo:active{
    color:#5400fd;
    border-color:#5400fd;
}

/* ================= メニュー ================= */

.menu-btn{
    position:fixed;
    top:10px;
    right:50px;
    font-size:40px;
    cursor:pointer;
    z-index:10000;
    color:white;
    transition: 0.3s ease;
}

.menu-btn:hover {
    color: rgba(255,255,255,0.4);
    transform: scale(0.98);
}

.menu{
    position:fixed;
    top:0;
    right:0;
    width:150px;
    height:100vh;
    background:#290db7;
    padding:120px 60px;
    transform:translateX(100%);
    transition:transform .5s ease;
    z-index:9999;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    font-size:20px;
    margin-bottom:40px;
    font-family:'Bespoke';
    transition: 0.3s ease;
}
.menu a:hover {
    color: rgba(255,255,255,0.4);
    transform: scale(0.98);
}

.menu.open{
    transform:translateX(0);
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.5);
    opacity:0;
    pointer-events:none;
    transition:.4s ease;
    z-index:9000;
}

.overlay.show{
    opacity:1;
    pointer-events:auto;
}

/* ================= 上部ビジュアル ================= */

.top-visual{
    width:80%;
    height:90px;          
    margin-top:2px;       /* ロゴと被らないため */
}

.top-visual img{
    width:80%;
    height:auto;
    object-fit:cover;      /* 重要：トリミングして全面表示 */
    display:block;
}

/* ================= タイトル ================= */

.page-title{
    margin:30px 0 10px 120px;
    font-size:50px;
    font-weight:500;
}

/* サブタイトル */

.sub-title{
    margin:0 0 0px 120px;
    font-size:17px;
    font-weight:300;
    opacity:0.8;
}

/* ================= レイアウト ================= */

.contact-wrapper{
    width:1000px;
    margin:-20px auto 100px auto;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
}

/* 左 */

.left-area h2{
    font-size:34px;
    margin-top: 25px;
    margin-left: 20px;
}

/* 右 */

.right-area h3{
    font-size:33px;
    margin-bottom:10px;
}

.right-area p{
    line-height:1.3;
    font-size:16px;
}

/* ================= フォーム ================= */

form{
    margin-top:40px;
}

.form-row{
    display:flex;
    gap:20px;
}

input, textarea{
    width:100%;
    padding:16px;
    margin-bottom:20px;
    border:none;
    border-radius:40px;
    font-size:16px;
}

textarea{
    height:100px;
    resize:none;
}

/* ================= Sendボタン（ロゴと同じ仕様） ================= */

button{
    padding:10px 25px;
    border:1px solid white;
    border-radius:40px;
    background:transparent;
    color:white;
    font-family:'Bespoke';
    font-size:16px;
    cursor:pointer;
    transition:.3s ease;
}

button:hover{
    background:white;
    color:#290db7;
}

/* すべての要素のカーソルを消す */
*{
    cursor: none !important;
}

body{
    overflow-x:hidden;
}

/* ================= スマホ最適化 ================= */

@media screen and (max-width:768px){

    /* タイトル */
    .page-title{
        font-size:32px;
        margin:0px 0 5px 6%;
    }

    .sub-title{
        margin:0 0 20px 6%;
        font-size:14px;
    }

    /* レイアウトを1カラムに */
    .contact-wrapper{
        width:90%;
        margin:0 0px 80px 5px;
        padding:20px 20px;
        box-sizing:border-box;
        grid-template-columns:1fr;
        gap:0px;
    }

    /* 左の雪エリア中央に */
    .left-area{
        text-align:center;
    }

    .left-area h2{
        margin:0;
        font-size:28px;
    }

    /* 右 */
    .right-area h3{
        font-size:24px;
    }

    .right-area p{
        font-size:14px;
    }

    /* フォーム */
    .form-row{
        flex-direction:column; /* 横並び→縦 */
        gap:0;
    }

    input, textarea{
        padding:14px;
        font-size:14px;
    }

    /* ロゴ位置 */
    .logo{
        left:20px;
        top:20px;
        padding:8px 18px;
        font-size:14px;
        white-space: nowrap;
    }

    /* メニュー幅調整 */
    .menu{
        width:40%;
        padding:120px 40px;
    }    
    .menu-btn{
        top:10px;
        font-family:'GeorgiaCustom';
        right:20px;
        font-size:32px;   
    }

        .top-visual{
        height:100px;                 
        margin:10px 0px 0px -20px;
        width:calc(100% - 30px);
        overflow:hidden;
    }

    .top-visual img{
        width:100%;
        height:80%;
    }

}
</style>
<style id="enhance">
/* ===== 追加分のみ（レイアウト・文字・余白は一切変更しません） ===== */
html.lock { overflow: hidden; }

a:focus-visible, .menu-btn:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }

/* メニュー：項目が順番にスライドイン */
.menu a { opacity: 0; transform: translateX(16px); transition: color .3s ease, opacity .4s ease, transform .5s cubic-bezier(.22,1,.36,1); }
.menu.open a { opacity: 1; transform: none; transition-delay: calc(var(--i, 0) * 50ms + .15s); }
.menu.open a:hover { color: rgba(255,255,255,.4); transform: scale(.98); transition-delay: 0s; }

/* 順番にふわっと表示 */
.js .rv { opacity: 0; transform: translateY(12px); transition: opacity .8s ease, transform .9s cubic-bezier(.22,1,.36,1); }
.js .rv.shown { opacity: 1; transform: none; }


/* 雪のカーソル */
.flake { position: fixed; top: 0; left: 0; color: #fff; pointer-events: none; opacity: 0; transition: opacity .3s; will-change: transform; user-select: none; }
.flake.on { opacity: 1; }
.flake.main  { font-size: 50px; z-index: 100000; }
.flake.trail { font-size: 40px; z-index: 99999; }
@media (hover: none), (pointer: coarse) { .flake.main, .flake.trail { display: none; } }
.burst { position: fixed; font-size: 30px; color: #fff; pointer-events: none; z-index: 99999; will-change: transform, opacity; }

@media (prefers-reduced-motion: reduce) {
  .menu, .menu a, .js .rv { transition-duration: .01s; transition-delay: 0s !important; }
}

/* 元の opacity:.8 を維持 */
.js .sub-title.rv.shown { opacity: .8; }

/* 入力欄・ボタンの操作感 */
input, textarea { transition: outline-offset .25s ease, box-shadow .25s ease; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
button:disabled { opacity: .6; pointer-events: none; }
button:active { transform: scale(.97); }

/* 送信結果のメッセージ */
.form-status { margin: 16px 0 0 4px; font-size: 14px; line-height: 1.4; }
.form-status:empty { display: none; }
.form-status[data-type="err"] { color: #ffc2c2; }
</style>

</head>

<body>

<!-- ロゴ -->
<a href="../index.html" class="logo">Heavenward Submarine</a>

<!-- メニュー -->
<div class="menu-btn" onclick="toggleMenu()">≡</div>

<div class="menu" id="menu">
    <a href="../index.html">Heavenward Submarine</a>
    <a href="../gallery/gallery.html">Gallery</a>
    <a href="../NewRelease/NewRelease.html">New Release</a>
    <a href="../About/About.html">About</a>
    <a href="../Contact/Contact.html">Contact</a>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="top-visual">
    <img src="../About/images/top-visual.webp" alt="">
</div>

<!-- タイトル -->
<h1 class="page-title">Contact</h1>
<h2 class="sub-title">お問い合わせ</h2>

<div class="contact-wrapper">

    <!-- 左 -->
    <div class="left-area">
        <h2>❄︎<br>
          ❄︎
        </h2>
    </div>

    <!-- 右 -->
    <div class="right-area">

        <h3>Dear :</h3>

        <p>
        Thank you for your visiting!<br><br>
        If you have any questions, suggestions, or collaboration opportunities,
        please feel free to contact me.
        </p>

        <!-- フォーム -->
        <form action="https://formspree.io/f/mnjbweqn" method="POST">

            <div class="form-row">
                <input type="text" name="first_name" placeholder="First name (required)" required>
                <input type="text" name="last_name" placeholder="Last name (required)" required>
            </div>

            <input type="email" name="email" placeholder="メール (required)" required>

            <textarea name="message" placeholder="Message" required></textarea>

            <button type="submit">Send</button>

        </form>

    </div>

</div>

<script>
(() => {
  const fine   = matchMedia('(hover: hover) and (pointer: fine)');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  /* ================= メニュー（HTMLはそのまま／onclickも維持） ================= */
  const menu    = document.getElementById('menu');
  const overlay = document.getElementById('overlay');
  const menuBtn = document.querySelector('.menu-btn');
  menu.querySelectorAll('a').forEach((a, i) => a.style.setProperty('--i', i));
  menu.inert = true;
  menuBtn.setAttribute('role', 'button');
  menuBtn.setAttribute('tabindex', '0');
  menuBtn.setAttribute('aria-label', 'メニューを開く');
  menuBtn.setAttribute('aria-expanded', 'false');
  menuBtn.setAttribute('aria-controls', 'menu');

  const menuOpen = () => menu.classList.contains('open');
  function setMenu(open, returnFocus) {
    menu.classList.toggle('open', open);
    overlay.classList.toggle('show', open);
    menu.inert = !open;
    document.documentElement.classList.toggle('lock', open);
    menuBtn.setAttribute('aria-expanded', open);
    menuBtn.setAttribute('aria-label', open ? 'メニューを閉じる' : 'メニューを開く');
    if (open) menu.querySelector('a').focus({ preventScroll: true });
    else if (returnFocus) menuBtn.focus();
  }
  window.toggleMenu = () => setMenu(!menuOpen());
  menuBtn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.toggleMenu(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && menuOpen()) setMenu(false, true);
  });

  /* ================= 順番にふわっと表示（透明度と微小な移動のみ・レイアウトは不変） ================= */
  const items = [...document.querySelectorAll('.page-title, .sub-title, .left-area, .right-area > *')];
  items.forEach(el => el.classList.add('rv'));
  if (reduce.matches || !('IntersectionObserver' in window)) {
    items.forEach(el => el.classList.add('shown'));
  } else {
    let batch = 0;
    const io = new IntersectionObserver(entries => {
      batch = 0;
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        en.target.style.transitionDelay = (batch++ * 90) + 'ms';
        en.target.classList.add('shown');
        io.unobserve(en.target);
      });
    }, { threshold: 0, rootMargin: '0px 0px -4% 0px' });
    items.forEach(el => io.observe(el));
  }

  /* ================= 雪のカーソル（マウス環境のみ表示） ================= */
  const main  = makeFlake('main');
  const trail = makeFlake('trail');
  function makeFlake(type) {
    const el = document.createElement('div');
    el.className = 'flake ' + type;
    el.textContent = '❄︎';
    el.setAttribute('aria-hidden', 'true');
    document.body.appendChild(el);
    return el;
  }

  let mx = 0, my = 0, tx = 0, ty = 0;
  let scale = 1, scaleTarget = 1, spin = 0;
  let running = false, last = 0, shown = false;

  function place(el, x, y, s, r) {
    el.style.transform =
      `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${s}) rotate(${r}deg)`;
  }
  function frame(now) {
    const dt = Math.min(now - last, 50) || 16;
    last = now;
    const k = reduce.matches ? 1 : 1 - Math.pow(1 - 0.3, dt / 16.67);
    const dx = mx - tx, dy = my - ty;
    tx += dx * k;
    ty += dy * k;
    scale += (scaleTarget - scale) * Math.min(1, dt / 90);
    spin += (dx + dy) * 0.02 * (dt / 16.67);
    place(main, mx, my, scale, 0);
    place(trail, tx, ty, 1, reduce.matches ? 0 : spin);
    if (Math.abs(dx) < .1 && Math.abs(dy) < .1 && Math.abs(scaleTarget - scale) < .005) { running = false; return; }
    requestAnimationFrame(frame);
  }
  function kick() {
    if (running) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }

  document.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !fine.matches) return;
    mx = e.clientX; my = e.clientY;
    if (!shown) {
      shown = true;
      tx = mx; ty = my;
      main.classList.add('on');
      trail.classList.add('on');
    }
    kick();
  }, { passive: true });

  document.documentElement.addEventListener('mouseleave', () => {
    main.classList.remove('on'); trail.classList.remove('on'); shown = false;
  });

  // リンク（画像のPDFリンクを含む）の上では雪が大きくなる
  document.addEventListener('pointerover', e => {
    if (e.pointerType !== 'mouse') return;
    scaleTarget = e.target.closest('a, button, .menu-btn') ? 1.4 : (e.target.closest('input, textarea') ? .7 : 1);
    kick();
  });

  /* ================= クリックで雪が舞う ================= */
  document.addEventListener('click', e => {
    if (reduce.matches) return;
    const f = document.createElement('div');
    f.className = 'burst';
    f.textContent = '❄︎';
    f.style.left = e.clientX + 'px';
    f.style.top  = e.clientY + 'px';
    document.body.appendChild(f);
    f.animate([
      { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)',     opacity: 1 },
      { transform: 'translate(-50%, -50%) rotate(300deg) scale(1.3)', opacity: 0 }
    ], { duration: 800, easing: 'linear' })
     .finished.then(() => f.remove(), () => f.remove());
  });

  /* ================= お問い合わせフォーム（送信先・HTMLは元のまま。JSが使えない場合は従来どおり送信） ================= */
  const form = document.querySelector('form');
  if (form) {
    const btn = form.querySelector('button[type="submit"]');
    const status = document.createElement('p');
    status.className = 'form-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    form.appendChild(status);

    form.addEventListener('submit', async e => {
      if (!/^https:\/\/formspree\.io\//.test(form.action)) return;
      e.preventDefault();
      if (btn.disabled) return;
      const label = btn.textContent;
      btn.style.minWidth = btn.offsetWidth + 'px';           // 文字が変わっても幅を保つ
      btn.disabled = true;
      btn.textContent = 'Sending…';
      status.textContent = '';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        });
        if (!res.ok) throw new Error('send failed');
        form.reset();
        btn.textContent = 'Sent ✓';
        status.dataset.type = 'ok';
        status.textContent = 'Thank you! Your message has been sent. / 送信しました。ありがとうございます。';
        setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 3000);
      } catch (_) {
        btn.textContent = label;
        btn.disabled = false;
        status.dataset.type = 'err';
        status.textContent = 'Something went wrong. Please try again. / 送信できませんでした。もう一度お試しください。';
      }
    });
  }

  /* ================= ページの事前読み込み（HTMLページのみ。PDFは対象外） ================= */
  const prefetched = new Set();
  ['pointerenter', 'touchstart', 'focusin'].forEach(type =>
    document.addEventListener(type, e => {
      const a = e.target.closest && e.target.closest('a[href]');
      if (!a || prefetched.has(a.href) || a.origin !== location.origin) return;
      if (!/(\.html)?$/.test(a.pathname) || /\.pdf$/i.test(a.pathname)) return;
      prefetched.add(a.href);
      const l = document.createElement('link');
      l.rel = 'prefetch';
      l.href = a.href;
      document.head.appendChild(l);
    }, { passive: true, capture: true }));
})();
</script>
